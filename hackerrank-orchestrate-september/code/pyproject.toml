[project]
name = "bow"
version = "0.1.0"
description = "Buy or Wait? — deterministic financial solver with a narrow LLM perception layer."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "sarvamai>=0.1",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "pyyaml>=6",
    "tenacity>=8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:cacheprovider keeps .pytest_cache out of the submission root.
# Byte-code writing is disabled in tests/conftest.py for the same reason.
addopts = "-p no:cacheprovider -q"
markers = [
    "dataset: reads dataset/ rather than a hand-built fixture; deselect with -m 'not dataset'",
]
